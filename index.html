<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureTank Dealers - السوق التجاري المعتمد</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الهيدر واللوجو والسلوجان الجديد -->
    <header class="main-header">
        <div class="container header-content">
            <img src="logo.png" alt="فيوتشرتانك" class="brand-logo" onerror="this.style.display='none'">
            <div class="header-text">
                <h1 class="logo">FutureTank <span>Dealers</span></h1>
                <p class="tagline">المنصة التجارية المعتمدة للشبكات، الخدمات، والتجارة العامة</p>
            </div>
        </div>
    </header>

    <!-- شريط تصفية جميع محافظات مصر -->
    <section class="filter-section">
        <div class="container">
            <label for="gov-select">اختر المحافظة لعرض العروض والمنتجات المتاحة:</label>
            <select id="gov-select" onchange="onGovernorateChange()">
                <option value="All">جميع المحافظات 🇪🇬</option>
                <option value="القاهرة">القاهرة</option>
                <option value="الجيزة">الجيزة</option>
                <option value="الإسكندرية">الإسكندرية</option>
                <option value="القليوبية">القليوبية</option>
                <option value="الشرقية">الشرقية</option>
                <option value="الدقهلية">الدقهلية</option>
                <option value="البحيرة">البحيرة</option>
                <option value="المنوفية">المنوفية</option>
                <option value="الغربية">الغربية</option>
                <option value="كفر الشيخ">كفر الشيخ</option>
                <option value="دمياط">دمياط</option>
                <option value="بورسعيد">بورسعيد</option>
                <option value="الإسماعيلية">الإسماعيلية</option>
                <option value="السويس">السويس</option>
                <option value="الفيوم">الفيوم</option>
                <option value="بني سويف">بني سويف</option>
                <option value="المنيا">المنيا</option>
                <option value="أسيوط">أسيوط</option>
                <option value="سوهاج">سوهاج</option>
                <option value="قنا">قنا</option>
                <option value="الأقصر">الأقصر</option>
                <option value="أسوان">أسوان</option>
                <option value="شمال سيناء">شمال سيناء</option>
                <option value="جنوب سيناء">جنوب سيناء</option>
                <option value="البحر الأحمر">البحر الأحمر</option>
                <option value="الوادي الجديد">الوادي الجديد</option>
                <option value="مطروح">مطروح</option>
            </select>
        </div>
    </section>

    <!-- شبكة عرض المنتجات -->
    <main class="container">
        <div id="loading" class="loading-spinner">جاري تحميل المنتجات والخدمات...</div>
        <div id="products-container" class="products-grid"></div>
    </main>

    <!-- الفوتر -->
    <footer>
        <div class="container">
            <p>جميع الحقوق محفوظة &copy; 2026 FutureTank Dealers</p>
            <p>للاشتراك كتاجر وتفعيل الباقة، التواصل عبر الواتساب/إينستاباي: <strong>01150402031</strong></p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
